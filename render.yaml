services:
  - type: web
    name: cybex-recon-engine
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --config gunicorn.conf.py app:app
    healthCheckPath: /health
    plan: free
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.10
      - key: FLASK_DEBUG
        value: "0"
